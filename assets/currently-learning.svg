      Responsible &amp; Trustworthy AI Systems
    </text>

  </g>



  <!-- ================================================= -->
  <!-- CARD 6 -->
  <!-- ================================================= -->

  <g filter="url(#cardGlow)">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -4; 0 0"
      begin="3.5s"
      dur="5s"
      repeatCount="indefinite"
    />

    <rect
      x="465"
      y="365"
      width="395"
      height="102"
      rx="14"
      fill="url(#card)"
      stroke="#123B78"
    />

    <circle
