  <!-- ================= FOOTER ================= -->

  <text
    x="450"
    y="497"
    text-anchor="middle"
    fill="#8796B4"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    letter-spacing="2"
  >
    LEARNING • BUILDING • EXPLORING

    <animate
      attributeName="fill"
      values="#8796B4;#4CC9F0;#8796B4"
      dur="6s"
      repeatCount="indefinite"
    />

  </text>

</svg>
