<svg
  width="900"
  height="520"
  viewBox="0 0 900 520"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="520">
      <stop offset="0%" stop-color="#04142E">
        <animate
          attributeName="stop-color"
          values="#04142E;#061A3A;#04142E"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#081F46">
        <animate
          attributeName="stop-color"
          values="#081F46;#0A2860;#081F46"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>


    <!-- CARD GRADIENT -->
    <linearGradient id="card" x1="0" y1="0" x2="400" y2="150">
      <stop stop-color="#0A2860"/>
      <stop offset="1" stop-color="#081F46"/>
    </linearGradient>


    <!-- CYAN GLOW -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


    <!-- SOFT CARD GLOW -->
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="6"
        flood-color="#4CC9F0"
        flood-opacity="0.08"
      />
    </filter>

  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect
    x="1"
    y="1"
    width="898"
    height="518"
    rx="22"
    fill="url(#bg)"
    stroke="#0A2860"
    stroke-width="2"
  />


  <!-- MOVING BACKGROUND LIGHT -->

  <circle
    cx="100"
    cy="100"
    r="120"
    fill="#4CC9F0"
    opacity="0.03"
    filter="url(#cyanGlow)"
  >
    <animate
      attributeName="cx"
      values="100;800;100"
      dur="12s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="cy"
      values="100;400;100"
      dur="12s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- ================= HEADER ================= -->

  <text
    x="40"
    y="55"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="27"
    font-weight="700"
  >
    Currently Digging Into

    <animate
      attributeName="opacity"
      values="0.85;1;0.85"
      dur="4s"
      repeatCount="indefinite"
    />

  </text>


  <text
    x="40"
    y="83"
    fill="#8796B4"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
  >
    Exploring AI, emerging computing, intelligent systems and software engineering
  </text>


  <!-- BASE LINE -->

  <rect
    x="40"
    y="101"
    width="820"
    height="2"
    rx="1"
    fill="#0A2860"
  />


  <!-- ANIMATED CYAN LINE -->

  <rect
    x="40"
    y="101"
    width="135"
    height="2"
    rx="1"
    fill="#4CC9F0"
    filter="url(#cyanGlow)"
  >

    <animate
      attributeName="width"
      values="60;180;135;60"
      dur="4s"
      repeatCount="indefinite"
    />

  </rect>



  <!-- ================================================= -->
  <!-- CARD 1 -->
  <!-- ================================================= -->

  <g filter="url(#cardGlow)">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -4; 0 0"
      dur="5s"
      repeatCount="indefinite"
    />

    <rect
      x="40"
      y="125"
      width="395"
      height="102"
      rx="14"
      fill="url(#card)"
      stroke="#123B78"
    />

    <circle
      cx="68"
      cy="155"
      r="15"
      fill="#061A3A"
      stroke="#4CC9F0"
      stroke-opacity="0.4"
    >

      <animate
        attributeName="r"
        values="15;17;15"
        dur="3s"
        repeatCount="indefinite"
      />

    </circle>

    <text
      x="62"
      y="161"
      fill="#4CC9F0"
      font-family="Arial"
      font-size="17"
      filter="url(#cyanGlow)"
    >
      ◆
    </text>

    <text
      x="95"
      y="158"
      fill="#4CC9F0"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16"
      font-weight="700"
    >
      AI &amp; Automation
    </text>

    <text
      x="95"
      y="184"
      fill="#FFFFFF"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
    >
      AI for Robotic Process Automation
    </text>

    <text
      x="95"
      y="205"
      fill="#B8C7E0"
      font-family="Arial, Helvetica, sans-serif"
      font-size="12"
    >
      Generative AI • Advanced Neural Networks
    </text>

  </g>



  <!-- ================================================= -->
  <!-- CARD 2 -->
  <!-- ================================================= -->

  <g filter="url(#cardGlow)">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -4; 0 0"
      begin="0.7s"
      dur="5s"
      repeatCount="indefinite"
    />

    <rect
      x="465"
      y="125"
      width="395"
      height="102"
      rx="14"
      fill="url(#card)"
      stroke="#123B78"
    />

    <circle
      cx="493"
      cy="155"
